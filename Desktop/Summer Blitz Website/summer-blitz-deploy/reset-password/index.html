<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>Reset your password · STK</title>
<style>
@font-face{font-family:Oswald;src:url('/fonts/Oswald-VariableFont_wght.ttf') format('truetype');font-display:swap}@font-face{font-family:Inter;src:url('/fonts/Inter-VariableFont.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#f5f5f5;font-family:Inter,Arial,sans-serif;font-size:16px;line-height:1.6}main{width:100%;max-width:480px;margin:auto;padding:56px 20px 40px}header{text-align:center;margin-bottom:32px}.logo{width:88px;height:88px;object-fit:contain}h1{font-family:Oswald,Arial,sans-serif;font-size:34px;font-weight:600;line-height:1.2;margin:20px 0 14px}p{color:#c4c4c4;margin:0 0 24px}label{display:block;margin:20px 0 8px;font-weight:600}input,button,.primary{width:100%;min-height:48px;border-radius:6px;font:inherit}input{padding:12px;border:1px solid #626262;background:#1a1a1a;color:#fff}button,.primary{display:block;padding:12px 16px;background:#CC2929;color:#fff;border:0;font-weight:600;text-align:center;text-decoration:none;margin-top:24px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}a{color:#efb5b5;text-underline-offset:4px}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}.secondary{display:block;text-align:center;margin-top:24px}.hint{font-size:14px;margin-top:8px}.status{margin:0 0 20px;color:#eee;overflow-wrap:anywhere}.status:empty{display:none}[hidden]{display:none!important}footer{text-align:center;margin-top:40px;color:#a8a8a8;font-size:14px}
</style>
</head>
<body><main>
<header><a href="https://stkpoolleague.com/" aria-label="STK home"><img class="logo" src="/assets/logo-skull-circle.png" alt="Shoot to Kill Pool League" width="88" height="88"></a><h1 id="heading" tabindex="-1">Reset your password</h1><p id="intro">Enter your account email and we’ll send you a reset link.</p></header>
<p id="status" class="status" role="status" aria-live="polite">Loading secure password reset…</p>
<form id="request-form" hidden><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required><button type="submit">Send reset link</button></form>
<form id="password-form" hidden><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint"><p class="hint" id="password-hint">Use at least 8 characters.</p><label for="confirmation">Confirm new password</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Save new password</button><a class="secondary" href="/reset-password/">Request a fresh reset link</a></form>
<a id="sign-in" class="secondary" href="https://stkscore.live/join/">Sign in</a>
<noscript><p>Please enable JavaScript to securely reset your password.</p></noscript>
<footer>Shoot to Kill Pool League</footer>
</main><script type="module" src="./page.mjs"></script></body>
</html>
